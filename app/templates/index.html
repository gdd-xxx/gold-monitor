<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoldPulse - 金价监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="logo">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 6v12M8 9.5c0-1.38 1.79-2.5 4-2.5s4 1.12 4 2.5-1.79 2.5-4 2.5-4 1.12-4 2.5 1.79 2.5 4 2.5"/>
            </svg>
            <span>GoldPulse</span>
        </div>
        <nav>
            <a class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
                <span>仪表盘</span>
            </a>
            <a class="nav-item" data-tab="watches" onclick="switchTab('watches')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                <span>监控列表</span>
            </a>
            <a class="nav-item" data-tab="pnl" onclick="switchTab('pnl')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>盈亏计算</span>
            </a>
            <a class="nav-item" data-tab="settings" onclick="switchTab('settings')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
                <span>设置</span>
            </a>
            <a class="nav-item" data-tab="chat" onclick="switchTab('chat')">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                <span>聊天控制</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">连接中...</span>
        </div>
    </aside>

    <main class="main">
        <div class="tab-content active" id="tab-dashboard">
            <div class="price-hero">
                <div class="price-main">
                    <div class="price-label">实时金价</div>
                    <div class="price-value" id="currentPrice">--</div>
                    <div class="price-unit">元/克</div>
                </div>
                <div class="price-meta">
                    <div class="meta-item">
                        <span class="meta-label">更新时间</span>
                        <span class="meta-value" id="priceTime">--</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">数据源</span>
                        <span class="meta-value" id="priceSource">浙商银行</span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">今日涨跌</span>
                        <span class="meta-value" id="priceChange">--</span>
                    </div>
                </div>
            </div>

            <div class="chart-section">
                <div class="section-header">
                    <h3>价格走势</h3>
                    <div class="chart-controls">
                        <button class="chip active" onclick="setChartRange(1, this)">今日</button>
                        <button class="chip" onclick="setChartRange(7, this)">7天</button>
                        <button class="chip" onclick="setChartRange(30, this)">30天</button>
                        <button class="chip" onclick="setChartRange(90, this)">90天</button>
                    </div>
                </div>
                <div class="chart-wrapper">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>

            <div class="records-section">
                <div class="section-header">
                    <h3>今日记录</h3>
                    <span class="badge" id="recordCount">0条</span>
                </div>
                <div class="records-list" id="todayPrices">
                    <div class="empty-state">暂无数据</div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-watches">
            <div class="card">
                <div class="section-header">
                    <h3>添加监控</h3>
                </div>
                <div class="search-box">
                    <input type="text" id="watchSearchInput" placeholder="输入股票名称、代码或基金代码..." onkeypress="if(event.key==='Enter')searchWatch()">
                    <button onclick="searchWatch()" class="btn btn-primary" id="btnSearchWatch">搜索</button>
                </div>
                <div id="searchResults" class="search-results"></div>
            </div>

            <div class="card">
                <div class="section-header">
                    <h3>监控列表</h3>
                    <span class="badge" id="watchCount">0条</span>
                </div>
                <div id="watchList" class="watch-list">
                    <div class="empty-state">暂无监控，搜索添加股票/基金</div>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-pnl">
            <div class="pnl-form card">
                <h3>添加买入记录</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>买入金价</label>
                        <div class="input-with-unit">
                            <input type="number" id="buyPrice" step="0.01" placeholder="0.00">
                            <span class="unit">元/克</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>买入数量</label>
                        <div class="input-with-unit">
                            <input type="number" id="buyWeight" step="0.01" placeholder="0.00">
                            <span class="unit">克</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>买入金额</label>
                        <div class="input-with-unit">
                            <input type="number" id="buyAmount" step="0.01" placeholder="自动计算">
                            <span class="unit">元</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>手续费</label>
                        <div class="input-with-unit">
                            <input type="number" id="buyFee" step="0.01" value="0" placeholder="0">
                            <span class="unit">%</span>
                        </div>
                    </div>
                    <div class="form-group full-width">
                        <label>备注</label>
                        <input type="text" id="buyNote" placeholder="如: 2024年1月购入">
                    </div>
                </div>
                <button onclick="addPurchase()" class="btn btn-primary btn-block">添加记录</button>
            </div>
            <div id="pnlResults"></div>
        </div>

        <div class="tab-content" id="tab-settings">
            <div class="card">
                <h3>数据源</h3>
                <div class="form-group">
                    <label class="switch-label">
                        <input type="checkbox" id="useCustomApi">
                        <span class="switch"></span>
                        <span>使用自定义API</span>
                    </label>
                </div>
                <div class="form-group">
                    <label>自定义API地址</label>
                    <input type="text" id="customApiUrl" placeholder="https://your-api.com/gold">
                </div>
                <div class="form-group">
                    <label>查询间隔</label>
                    <div class="interval-control">
                        <button class="chip" onclick="setInterval_(60, this)">1分钟</button>
                        <button class="chip active" onclick="setInterval_(300, this)">5分钟</button>
                        <button class="chip" onclick="setInterval_(600, this)">10分钟</button>
                        <button class="chip" onclick="setInterval_(1800, this)">30分钟</button>
                        <input type="number" id="customInterval" placeholder="自定义" min="30" step="30">
                        <span class="unit">秒</span>
                    </div>
                </div>
                <button onclick="saveSourceSettings()" class="btn btn-primary">保存设置</button>
            </div>

            <div class="card">
                <h3>推送渠道</h3>
                <div class="channel-card">
                    <div class="channel-header">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#07c160"><path d="M8.691 2.188C3.891 2.188 0 5.476 0 9.53c0 2.212 1.17 4.203 3.002 5.55a.59.59 0 01.213.665l-.39 1.48c-.019.07-.048.141-.048.213 0 .163.13.295.29.295a.326.326 0 00.167-.054l1.903-1.114a.864.864 0 01.717-.098 10.16 10.16 0 002.837.403c.276 0 .543-.027.811-.05-.857-2.578.157-4.972 1.932-6.446 1.703-1.415 3.882-1.98 5.853-1.838-.576-3.583-4.196-6.348-8.596-6.348zM5.785 5.991c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178A1.17 1.17 0 014.623 7.17c0-.651.52-1.18 1.162-1.18zm5.813 0c.642 0 1.162.529 1.162 1.18a1.17 1.17 0 01-1.162 1.178 1.17 1.17 0 01-1.162-1.178c0-.651.52-1.18 1.162-1.18zm3.97 2.887c-1.905-.056-3.867.536-5.39 1.805-1.26 1.05-2.07 2.436-2.316 3.897-.248 1.46-.048 2.828.672 4.093 1.564 2.056 4.428 3.13 7.193 3.13.79 0 1.576-.09 2.336-.264a.722.722 0 01.598.082l1.586.929a.272.272 0 00.14.045c.134 0 .241-.111.241-.247 0-.06-.024-.12-.04-.178l-.327-1.233a.493.493 0 01.178-.554C23.144 18.48 24 16.82 24 14.98c0-3.21-2.867-5.964-6.493-6.077V8.9a.174.174 0 00-.174-.174h-.004a.174.174 0 00-.172.178v.05c-.028.007-.056.015-.083.024zm-2.516 2.44c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982zm-4.844 0c.535 0 .969.44.969.982a.976.976 0 01-.969.983.976.976 0 01-.969-.983c0-.542.434-.982.97-.982z"/></svg>
                        <span>企业微信</span>
                        <div class="test-btn" onclick="testPush('wechat')">测试</div>
                    </div>
                    <input type="text" id="wechatWebhook" placeholder="Webhook地址">
                </div>
                <div class="channel-card">
                    <div class="channel-header">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#3370ff"><path d="M19.437 11.08l-1.342-3.97a1.267 1.267 0 00-1.207-.863H7.112a1.267 1.267 0 00-1.207.863l-1.342 3.97a1.267 1.267 0 00.468 1.446l5.24 3.616a.5.5 0 00.574 0l5.24-3.616a1.267 1.267 0 00.352-1.446z"/></svg>
                        <span>飞书</span>
                        <div class="test-btn" onclick="testPush('feishu')">测试</div>
                    </div>
                    <input type="text" id="feishuWebhook" placeholder="Webhook地址">
                </div>
                <div class="channel-card">
                    <div class="channel-header">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#12b7f5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                        <span>QQ机器人</span>
                        <div class="test-btn" onclick="testPush('qq')">测试</div>
                    </div>
                    <div class="form-row-inline">
                        <input type="text" id="qqAppId" placeholder="AppID">
                        <input type="text" id="qqToken" placeholder="Token/Secret">
                    </div>
                    <div class="form-group">
                        <label>用户ID (用于私聊推送)</label>
                        <input type="text" id="qqUserId" placeholder="输入你的QQ用户ID">
                    </div>
                </div>
                <button onclick="savePushSettings()" class="btn btn-primary">保存推送设置</button>
            </div>

            <div class="card">
                <h3>价格预警</h3>
                <div class="form-group">
                    <label class="switch-label">
                        <input type="checkbox" id="alertEnabled">
                        <span class="switch"></span>
                        <span>启用价格预警</span>
                    </label>
                </div>
                <div class="threshold-row">
                    <div class="form-group">
                        <label>低于此价推送</label>
                        <div class="input-with-unit">
                            <input type="number" id="alertLow" step="0.01" placeholder="870">
                            <span class="unit">元/克</span>
                        </div>
                    </div>
                    <span class="threshold-sep">~</span>
                    <div class="form-group">
                        <label>高于此价推送</label>
                        <div class="input-with-unit">
                            <input type="number" id="alertHigh" step="0.01" placeholder="900">
                            <span class="unit">元/克</span>
                        </div>
                    </div>
                </div>
                <button onclick="saveAlertSettings()" class="btn btn-primary">保存预警设置</button>
            </div>

            <div class="card">
                <h3>应用更新</h3>
                <div class="update-info">
                    <div class="update-row">
                        <span class="update-label">当前版本</span>
                        <span class="update-value" id="currentVersion">v1.2.0</span>
                    </div>
                    <div class="update-row">
                        <span class="update-label">最新版本</span>
                        <span class="update-value" id="latestVersion">检查中...</span>
                    </div>
                    <div class="update-status" id="updateStatus"></div>
                </div>
                <div class="update-actions">
                    <button onclick="checkUpdate()" class="btn btn-primary" id="btnCheckUpdate">检查更新</button>
                    <button onclick="applyUpdate()" class="btn btn-primary" id="btnApplyUpdate" style="display:none;background:var(--green)">立即更新</button>
                </div>
            </div>
        </div>

        <div class="tab-content" id="tab-chat">
            <div class="chat-container">
                <div class="chat-messages" id="chatMessages">
                    <div class="chat-msg system">输入命令控制程序，如"添加监控 贵州茅台"、"查询"、"帮助"</div>
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" placeholder="输入命令..." onkeypress="if(event.key==='Enter')sendChat()">
                    <button onclick="sendChat()" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/static/app.js"></script>
</body>
</html>
